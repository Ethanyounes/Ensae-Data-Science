[project]
name = "squeeze-prediction"
version = "0.1.0"
description = "Le positionnement des traders annonce-t-il les short squeezes sur les perpétuels crypto ? (projet ENSAE 2A)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=21,<25",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scipy>=1.17.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
